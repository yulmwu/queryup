coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 70%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "node_modules/**"
  - "dist/**"
  - "coverage/**"
  - "docs/**"
  - "assets/**"
  - "mvp-frontend/**"
  - "test/**"
  - "src/**/*.dto.ts"
  - "src/**/dto/**"
  - "src/**/*.module.ts"
  - "src/common/types/**"
  - "src/common/constants/**"
  - "src/main.ts"
  - "src/migrations/**"
  - "src/modules/migrations/**"
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - "**/*.e2e-spec.ts"
